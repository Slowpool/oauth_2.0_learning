services:
  authorization_server:
    container_name:
      'authorization_server'
    build:
      context: '../authorization_server'
      dockerfile: './.docker/dev.Dockerfile'
    volumes:
      # TODO why rw?
      - '../authorization_server/target/classes:/app/BOOT-INF/classes:rw'
      - '../authorization_server/target/lib:/app/BOOT-INF/lib:rw'
    env_file:
      '../authorization_server/.docker/.env'
    ports:
      - "${AUTHORIZATION_SERVER_PORT}:8081"
      - "5005:5005"
    # TODO depends on postgres

